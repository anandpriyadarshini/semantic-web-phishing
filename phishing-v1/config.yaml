# ─── Semantic-Web Phishing Detection Framework ─── #
# All paths, seeds, and hyperparameters in one place.

random_seed: 42

paths:
  raw_data:       data/raw
  processed_data: data/processed
  splits:         data/splits
  results:        results
  models:         results/models
  figures:        results/figures
  tables:         paper/tables
  ontology:       src/graph/ontology.ttl
  graph_output:   results/graph

data:
  # Data source: "refined_csv" (uses final_refined_dataset_phishing.csv) or "phishtank"
  source: "refined_csv"
  refined_csv_path: "final_refined_dataset_phishing.csv"
  phishtank_url: "http://data.phishtank.com/data/online-valid.csv"
  tranco_url: "https://tranco-list.eu/top-1m.csv.zip"
  # For dev loop: limit to this many rows per class (null = all 11430 rows)
  dev_sample_size: null
  min_urls_per_domain: 1

splitting:
  test_fraction: 0.2
  val_fraction: 0.1
  # Time-based split: train on entries before this percentile of timestamps
  time_split_train_percentile: 80
  cv_folds: 5

features:
  # Feature set: "dataset" (68 features from refined CSV), "lexical" (28 lexical/structural features), or "all"
  feature_set: "dataset"

  # 68 features from final_refined_dataset_phishing.csv
  dataset:
    - length_url
    - length_hostname
    - ip
    - nb_dots
    - nb_hyphens
    - nb_at
    - nb_qm
    - nb_and
    - nb_or
    - nb_eq
    - nb_underscore
    - nb_tilde
    - nb_percent
    - nb_slash
    - nb_star
    - nb_colon
    - nb_comma
    - nb_semicolumn
    - nb_dollar
    - nb_space
    - nb_www
    - nb_com
    - nb_dslash
    - http_in_path
    - https_token
    - ratio_digits_url
    - ratio_digits_host
    - tld_in_path
    - tld_in_subdomain
    - abnormal_subdomain
    - nb_subdomains
    - prefix_suffix
    - random_domain
    - shortening_service
    - nb_redirection
    - nb_external_redirection
    - length_words_raw
    - phish_hints
    - domain_in_brand
    - brand_in_subdomain
    - brand_in_path
    - suspecious_tld
    - statistical_report
    - nb_hyperlinks
    - ratio_intHyperlinks
    - ratio_extHyperlinks
    - ratio_nullHyperlinks
    - nb_extCSS
    - ratio_intRedirection
    - ratio_extRedirection
    - login_form
    - external_favicon
    - links_in_tags
    - submit_email
    - ratio_intMedia
    - ratio_extMedia
    - sfh
    - iframe
    - safe_anchor
    - domain_in_title
    - domain_with_copyright
    - whois_registered_domain
    - domain_registration_length
    - domain_age
    - web_traffic
    - dns_record
    - google_index
    - page_rank

  # Lexical / structural features (from Table 5 of original paper)
  lexical:
    - url_length
    - hostname_length
    - path_length
    - num_dots_in_url
    - num_dots_in_hostname
    - num_hyphens_in_url
    - num_hyphens_in_hostname
    - num_underscores_in_url
    - num_slashes_in_path
    - num_query_params
    - num_fragments
    - num_digits_in_url
    - num_digits_in_hostname
    - ratio_digits_url
    - ratio_digits_hostname
    - has_ip_address
    - has_at_symbol
    - has_double_slash_redirect
    - has_hex_encoding
    - has_www
    - has_https
    - url_entropy
    - hostname_entropy
    - longest_token_length
    - avg_token_length
    - num_subdomains
    - tld_length
    - path_depth

models:
  classifiers:
    KNN:
      n_neighbors: [3, 5, 7, 11]
      weights: [uniform, distance]
      metric: [euclidean, manhattan]
    DecisionTree:
      max_depth: [5, 10, 20, null]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 5]
    RandomForest:
      n_estimators: [100, 200]
      max_depth: [10, 20, null]
      min_samples_split: [2, 5]
      min_samples_leaf: [1, 2]
  baselines:
    LogisticRegression:
      C: [0.01, 0.1, 1.0, 10.0]
      max_iter: 1000
    XGBoost:
      n_estimators: [100, 200]
      max_depth: [3, 6, 10]
      learning_rate: [0.01, 0.1, 0.3]

xai:
  shap_n_samples: 100
  lime_n_features: 10
  lime_n_samples: 5000
  stability_n_runs: 5
  fidelity_top_k: [3, 5, 10]

enrichment:
  dns_timeout: 2
  whois_enabled: false   # python-whois ignores socket timeouts on dead domains; disable for speed
  whois_timeout: 5
  whois_rate_limit_seconds: 0.3
  cert_timeout: 5
  max_retries: 0
  cache_dir: data/cache

graph:
  campaign_resolution: 0.8   # Louvain resolution parameter
  min_campaign_size: 2
  max_urls: 200              # Maximum phishing URLs to enrich for knowledge graph

latency:
  n_stream_urls: 100
  warmup_urls: 10
  repetitions: 3
